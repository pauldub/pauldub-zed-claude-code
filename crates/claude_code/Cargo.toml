[package]
name = "claude_code"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
collections = { path = "../collections" }
credentials_provider = { path = "../credentials_provider" }
futures = "0.3"
gpui = { path = "../gpui" }
http_client = { path = "../http_client" }
icons = { path = "../icons" }
language_model = { path = "../language_model" }
log = "0.4"
parking_lot = "0.12"
phf = { version = "0.11", features = ["macros"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
settings = { path = "../settings" }
theme = { path = "../theme" }
thiserror = "1.0"
tokio = { version = "1.32", features = ["io-util", "process", "rt"] }
ui = { path = "../ui" }
util = { path = "../util" }
which = "6.0"